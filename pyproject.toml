[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "granola-sync"
version = "0.1.0"
description = "Sync Granola meeting notes to local Markdown files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.gui-scripts]
granola-sync = "granola_sync.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
