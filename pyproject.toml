[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "granola-sync"
version = "1.2.0"
description = "Sync Granola meeting notes to local Markdown files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pywebview>=5.0",
    # macOS WebKit backend for pywebview:
    "pyobjc-core>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.gui-scripts]
granola-sync = "granola_sync.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
granola_sync = ["_frontend/**/*"]
